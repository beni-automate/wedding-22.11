<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הזמנה לחתונה - חזקיהו רפאל & רבקה אפרת</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f7f9f6 0%, #ebf2eb 100%);
            --primary: #2d4a3e;
            --accent: #5c7866;
            --text: #2b332e;
            --card-bg: #ffffff;
            --border: #dce4dd;
            --gold: #c5a059;
        }
        body {
            font-family: 'Assistant', sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .invitation-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 45px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(45, 74, 62, 0.08);
            position: relative;
            overflow: hidden;
        }
        
        /* עיטורי פרחים בצדדים */
        .floral-decor {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.35;
            user-select: none;
            pointer-events: none;
        }
        .floral-top-left { top: 12px; left: 15px; transform: rotate(-45deg); }
        .floral-top-right { top: 12px; right: 15px; transform: rotate(45deg); }
        .floral-bottom-left { bottom: 12px; left: 15px; transform: rotate(-135deg); }
        .floral-bottom-right { bottom: 12px; right: 15px; transform: rotate(135deg); }

        .bismillah {
            font-size: 1rem;
            color: var(--gold);
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        h1 { 
            color: var(--primary); 
            font-size: 2.4rem; 
            margin: 5px 0 10px 0; 
            font-weight: 700;
        }
        .subtitle { 
            font-size: 1.25rem; 
            color: var(--accent); 
            margin-bottom: 25px; 
            font-weight: 400; 
        }
        .details-box {
            background: #f9fbf9;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 22px 20px;
            margin-bottom: 20px;
            text-align: right;
        }
        .details-box p { 
            margin: 10px 0; 
            font-size: 1.1rem; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* שמות ההורים למטה */
        .parents-section {
            margin: 15px 0 25px 0;
            padding-top: 15px;
            border-top: 1px solid #f0f4f0;
            font-size: 1rem;
            color: var(--accent);
            line-height: 1.6;
        }
        .parents-section div {
            margin: 4px 0;
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px 0;
            border-radius: 35px;
            font-weight: 600;
            font-size: 1.1rem;
            margin-top: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(45, 74, 62, 0.15);
        }
        .btn:hover { 
            background-color: var(--accent); 
            transform: translateY(-2px);
        }
        .btn-waze {
            background-color: #33cc66;
            box-shadow: 0 4px 15px rgba(51, 204, 102, 0.2);
        }
        .btn-waze:hover {
            background-color: #2eb85c;
        }
        form {
            margin-top: 30px;
            text-align: right;
            border-top: 2px dashed var(--border);
            padding-top: 25px;
        }
        form h3 { 
            color: var(--primary); 
            margin-top: 0; 
            text-align: center; 
            margin-bottom: 20px; 
            font-size: 1.35rem;
        }
        input, select {
            width: 100%;
            padding: 13px 15px;
            margin: 6px 0 18px 0;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-sizing: border-box;
            font-family: 'Assistant', sans-serif;
            font-size: 1.05rem;
            background: #fafcf9;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(45, 74, 62, 0.1);
        }
        label { 
            font-weight: 600; 
            font-size: 1rem; 
            color: var(--primary); 
        }
    </style>
</head>
<body>
    <div class="invitation-card">
        <!-- אלמנטים של פרחים בצדדים -->
        <div class="floral-decor floral-top-left">🌿🌸</div>
        <div class="floral-decor floral-top-right">🌸🌿</div>
        <div class="floral-decor floral-bottom-left">🌿🌸</div>
        <div class="floral-decor floral-bottom-right">🌸🌿</div>

        <div class="bismillah">בסיעתא דשמייא</div>

        <h1>חזקיהו רפאל & רבקה אפרת</h1>
        <div class="subtitle">מתרגשים להזמינכם לחתונתנו</div>
        
        <div class="details-box">
            <p>📅 <strong>יום ראשון, י"ב בכסלו תשפ"ז</strong></p>
            <p>🗓️ 22.11.2026</p>
            <p>🕖 <strong>חופה וקידושין:</strong> 18:00</p>
            <p>📍 <strong>אולם "קול שמחה", רותם 1, רכסים</strong></p>
        </div>

        <!-- שמות ההורים למטה -->
        <div class="parents-section">
            <div><strong>הורים חתן:</strong> צבי שנהב ורעייתו</div>
            <div><strong>הורים כלה:</strong> אבנר עובדיה ורעייתו</div>
        </div>

        <!-- כפתור ניווט ישיר לאפליקציית Waze -->
        <a href="waze://?q=Kollel%20Simcha%20Rechasim&navigate=yes" class="btn btn-waze">ניווט ישיר באפליקציית Waze 🚗</a>

        <!-- טופס אישור הגעה עם הקישור החדש מהתמונה -->
        <form action="https://formspree.io/f/xcekepk" method="POST">
            <h3>אישור הגעה (RSVP)</h3>
            
            <label>שם מלא:</label>
            <input type="text" name="name" required placeholder="הכנס שם מלא">
            
            <label>מספר מגיעים:</label>
            <select name="guests">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5+</option>
            </select>

            <button type="submit" class="btn" style="border: none; cursor: pointer;">שליחת אישור הגעה 💌</button>
        </form>
    </div>
</body>
</html>
